<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflective Agent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app" id="app-root">
      <div class="app-header">
        <h1>Reflective Agent <span class="mode-badge" id="mode-badge">reflection mode</span></h1>
        <label class="speech-toggle" for="speech-toggle">
          <input type="checkbox" id="speech-toggle" checked />
          Speech &amp; animation
        </label>
        <label class="heighten-control" for="heighten-slider" title="Exaggerates whichever emotion is currently most prominent, simulating a heightened/altered emotional state">
          Heighten
          <input type="range" id="heighten-slider" min="0" max="100" value="0" />
        </label>
        <select id="persona-select" class="hidden" title="Reflection mode's conversational persona"></select>
        <select id="mode-select">
          <option value="test">Test script</option>
          <option value="eliza">Eliza</option>
          <option value="reflection" selected>Reflection</option>
        </select>
      </div>

      <div id="usage-panel" class="usage-panel">
        <div class="usage-bar-row">
          <div class="usage-bar"><div id="usage-bar-fill" class="usage-bar-fill"></div></div>
          <button
            id="usage-reset-btn"
            class="usage-reset-btn hidden"
            type="button"
            title="Reset today's tracked usage to zero and continue"
          >
            Reset for today
          </button>
        </div>
        <div id="usage-text" class="usage-text">Loading usage…</div>
      </div>

      <div id="character-stage"></div>

      <div id="test-mode-panels">
        <section class="panel sliders-panel">
          <h2>Emotion sliders</h2>
          <div id="sliders"></div>
          <div id="sliders-overlay" class="sliders-overlay hidden"></div>
        </section>

        <section class="panel voice-panel">
          <h2>Voice</h2>
          <div class="voice-row">
            <label for="test-persona-select">Persona</label>
            <select id="test-persona-select" title="Load this persona's saved voice/pitch/rate, if any, for tuning"></select>
          </div>
          <div class="voice-row">
            <label for="voice-select">Voice</label>
            <select id="voice-select"></select>
          </div>
          <div class="slider-row">
            <label for="pitch-slider">Pitch</label>
            <input id="pitch-slider" type="range" min="0" max="2" step="0.05" value="1" />
            <output id="pitch-output">1.00</output>
          </div>
          <div class="slider-row">
            <label for="rate-slider">Rate</label>
            <input id="rate-slider" type="range" min="0.5" max="2" step="0.05" value="1" />
            <output id="rate-output">1.00</output>
          </div>
          <button
            id="voice-copy-btn"
            class="reflection-copy-btn"
            type="button"
            title="Copy a complete persona object (id, label, systemPrompt, voiceURI, pitch, rate) to paste into server/personas.ts"
          >
            Copy persona code
          </button>
        </section>

        <section class="panel script-panel">
          <div class="panel-header-row">
            <h2>Script</h2>
            <label
              class="react-toggle"
              for="react-toggle"
              title="Drive the character's emotion from the script text instead of the sliders"
            >
              <input type="checkbox" id="react-toggle" />
              React
            </label>
          </div>
          <textarea
            id="script-input"
            placeholder="Paste text here for the agent to read aloud..."
          ></textarea>
          <div class="script-controls">
            <button id="speak-btn" type="button">Speak</button>
            <button id="stop-btn" type="button">Stop</button>
          </div>
        </section>
      </div>

      <div id="dialog-mode-panels" class="hidden">
        <details id="reflection-notes-panel" class="panel hidden">
          <summary>Reflective notes</summary>
          <div id="reflection-migration-notice" class="reflection-migration-notice hidden">
            <span id="reflection-migration-notice-text"></span>
            <button
              id="reflection-migration-notice-dismiss"
              class="reflection-migration-notice-dismiss"
              type="button"
              aria-label="Dismiss notice"
            >
              ✕
            </button>
          </div>
          <div class="reflection-note">
            <span class="reflection-note-label">Personhood</span>
            <p id="reflection-personhood"></p>
          </div>
          <div class="reflection-note">
            <span class="reflection-note-label">Intersubjectivity</span>
            <p id="reflection-intersubjectivity"></p>
          </div>
          <div class="reflection-note">
            <span class="reflection-note-label">Legacy</span>
            <p id="reflection-legacy"></p>
          </div>
          <div class="reflection-note">
            <span class="reflection-note-label">Emotional state</span>
            <p id="reflection-emotion"></p>
          </div>
          <div class="reflection-note">
            <span class="reflection-note-label">Developer requests</span>
            <p id="reflection-developer-requests"></p>
            <button
              id="reflection-developer-requests-copy"
              class="reflection-copy-btn"
              type="button"
              title="Copy to clipboard"
            >
              Copy
            </button>
          </div>
          <div id="reflection-status" class="reflection-status"></div>
        </details>

        <div class="dialog-toolbar">
          <button id="reset-dialog-btn" type="button">Reset conversation</button>
        </div>
        <div id="dialog-history" class="panel dialog-history"></div>
        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            type="text"
            autocomplete="off"
            placeholder="Say something..."
          />
          <button id="chat-send-btn" type="submit">Send</button>
        </form>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
